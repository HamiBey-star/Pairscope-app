name: track-record
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/track.mjs
      - name: Commit changes
        run: |
          git config user.name "pairscope-bot"
          git config user.email "pairscope-bot@users.noreply.github.com"
          git add data/track-record.json
          git diff --cached --quiet || (git commit -m "Update track record" && git push)
