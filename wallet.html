<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet - Pairscope</title>
</head>
<body>
  <h1>Wallet</h1>
  <div id="out">Loading...</div>
  <script>
    const wallet = new URLSearchParams(location.search).get("address");
    const out = document.getElementById("out");
    if (!wallet) {
      out.textContent = "Add ?address=WALLET to the URL.";
    } else {
      fetch("https://pairscope-indexer2.dr-hamzakhan0.workers.dev/wallet?address=" + encodeURIComponent(wallet))
        .then(r => r.json())
        .then(d => {
          out.innerHTML =
            "Trades: " + d.trades +
            "<br>Buys: " + d.buys + " | Sells: " + d.sells +
            "<br>SOL spent: " + d.sol_spent.toFixed(4) +
            "<br>SOL received: " + d.sol_received.toFixed(4);
        })
        .catch(() => { out.textContent = "Could not load wallet data."; });
    }
  </script>
</body>
</html>
